<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOUBLE TROUBLE STUDIOS // Game Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dt-black: #050507; --dt-dark-grey: #16161c; --dt-medium-grey: #2c2c38; --dt-white: #ffffff; --dt-accent: #e63946; --dt-light-grey: #888899; --font-heading: 'Rajdhani', sans-serif; --font-body: 'Inter', sans-serif; }
        body.ubi-dark-mode { background-color: var(--dt-black); color: var(--dt-white); font-family: var(--font-body); margin: 0; padding-top: 80px; }
        .ubi-nav { position: fixed; top: 0; width: 100%; height: 80px; background: rgba(5, 5, 7, 0.95); backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid var(--dt-medium-grey); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .ubi-logo { font-family: var(--font-heading); font-weight: 900; font-size: 1.5rem; text-decoration: none; color: white; }
        .ubi-logo span { color: var(--dt-accent); }
        
        .hero { text-align: center; padding: 100px 20px; background-color: #16161c; color: white; }
        .hero h1 { font-family: var(--font-heading); font-size: 4rem; margin: 0; }
        .hero-cta { margin-top: 40px; display: block; }
        .hero-subtext { margin-top: 15px; color: var(--dt-light-grey); font-size: 0.9rem; letter-spacing: 1px; }
        
        .ubi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; padding: 60px 20px; max-width: 1200px; margin: 0 auto; }
        .ubi-card { background-color: var(--dt-dark-grey); border: 1px solid var(--dt-medium-grey); transition: 0.4s; flex-shrink: 0; }
        .ubi-card-image { width: 100%; height: 200px; object-fit: cover; }
        .ubi-card-info { padding: 25px; }
        
        .btn-ubi-primary { 
            background-color: var(--dt-accent); 
            color: white; 
            padding: 15px 40px; 
            border: none; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-family: var(--font-heading);
            font-weight: 700;
            border-radius: 8px; 
            display: inline-block; 
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-ubi-primary:hover { opacity: 0.9; }

        .editor-panel { display: none; position: fixed; bottom: 20px; right: 20px; background: var(--dt-dark-grey); padding: 20px; border: 1px solid var(--dt-accent); z-index: 2000; max-height: 80vh; overflow-y: auto; }
        .editor-panel.active { display: block; }
        .mobile-hint { display: none; text-align: center; color: var(--dt-light-grey); font-size: 0.9rem; margin-top: -30px; margin-bottom: 20px; }

        @media screen and (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .ubi-grid { display: flex; flex-wrap: nowrap; overflow-x: auto; padding: 20px; gap: 20px; scroll-snap-type: x mandatory; max-width: 100%; }
            .ubi-card { min-width: 80%; scroll-snap-align: center; }
            .mobile-hint { display: block; }
        }
    </style>
</head>
<body class="ubi-dark-mode">

    <nav class="ubi-nav">
        <a href="#" class="ubi-logo">DOUBLE<span>TROUBLE</span></a>
    </nav>

    <header id="hero-section" class="hero">
        <h1 id="hero-title">LOADING...</h1>
        <p id="hero-desc" style="color: var(--dt-light-grey); font-size: 1.2rem; max-width: 600px; margin: 20px auto;"></p>
        
        <div class="hero-cta">
            <a href="#subscribe" class="btn-ubi-primary">JOIN ALPHA</a>
            <p class="hero-subtext">GET EXCLUSIVE UPDATES & ALPHA ACCESS</p>
        </div>
    </header>

    <main>
        <section id="game-grid" class="ubi-grid"></section>
        <p class="mobile-hint">Slide right to see other games &rarr;</p>

        <section id="subscribe" style="text-align: center; margin-top: 80px; padding: 40px; background: rgba(255,255,255,0.03); border-top: 1px solid var(--dt-medium-grey);">
            <h2>STAY UPDATED</h2>
            <p style="color: var(--dt-light-grey);">Subscribe for our upcoming game releases.</p>
            <input type="email" id="sub-email" placeholder="ENTER YOUR EMAIL" style="padding: 12px; width: 250px; background: var(--dt-dark-grey); border: 1px solid var(--dt-medium-grey); color: white;">
            <button id="sub-btn" class="btn-ubi-primary">SUBSCRIBE</button>
        </section>
    </main>

    <div id="secret-editor" class="editor-panel">
        <div class="editor-header"><h3>DT_CORE // ADMIN</h3><button id="close-editor">&times;</button></div>
        <div id="login-screen">
            <input type="password" id="admin-pass" placeholder="KEY">
            <button id="login-btn" class="btn-ubi-primary">ACCESS</button>
        </div>
        <div id="editor-controls" style="display: none;">
            <h4>UPDATE HERO</h4>
            <input type="text" id="hero-title-in" placeholder="New Title">
            <input type="text" id="hero-desc-in" placeholder="New Desc">
            <input type="text" id="hero-img-in" placeholder="Image URL">
            <button id="update-hero" class="btn-ubi-primary">SAVE HERO</button>
            <hr>
            <h4>ADD GAME</h4>
            <input type="text" id="new-game-title" placeholder="Name">
            <input type="text" id="new-game-desc" placeholder="Description">
            <input type="text" id="new-game-img" placeholder="Image URL">
            <button id="add-game" class="btn-ubi-primary">SAVE GAME</button>
        </div>
    </div>

    <script>
        // HUOM: Vaihda TÄHÄN_SE_PITKÄ_KEY oikeaan avaimeen!
        const db = supabase.createClient("https://elifhcqurdemwsbgrxnu.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsaWZoY3F1cmRlbXdzYmdyeG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNTQ2NTUsImV4cCI6MjA5OTgzMDY1NX0.cKszlA20kGNJRiy8K5GNdgpsqCeYl98qwNS-AvHac_Q");
        
        async function fetchHero() {
            const { data } = await db.from('hero_content').select('*').eq('id', 1).single();
            if (data) {
                document.getElementById('hero-title').innerText = data.title;
                document.getElementById('hero-desc').innerText = data.description;
                if (data.bg_image_url) {
                    document.getElementById('hero-section').style.backgroundImage = `linear-gradient(rgba(5, 5, 7, 0.8), rgba(5, 5, 7, 0.8)), url('${data.bg_image_url}')`;
                    document.getElementById('hero-section').style.backgroundSize = "cover";
                    document.getElementById('hero-section').style.backgroundPosition = "center";
                }
            }
        }

        async function fetchGames() {
            const { data } = await db.from('games').select('*');
            if (data) {
                document.getElementById('game-grid').innerHTML = data.map(game => `
                    <div class="ubi-card">
                        <img src="${game.image_url || 'https://via.placeholder.com/400x200'}" class="ubi-card-image" onerror="this.src='https://via.placeholder.com/400x200'">
                        <div class="ubi-card-info"><h3>${game.title}</h3><p>${game.description}</p></div>
                    </div>
                `).join('');
            }
        }

        document.getElementById('sub-btn').addEventListener('click', async () => {
            const email = document.getElementById('sub-email').value;
            if(!email || !email.includes('@')) { alert("Please enter a valid email"); return; }
            
            // Varmista, että 'verified' on olemassa taulussa boolean-tyyppisenä
            const { error } = await db.from('subscribers').insert([{ email: email, verified: false }]);
            
            if (error) { 
                console.error("Error:", error); 
                alert("Something went wrong. Please check your console."); 
            } else { 
                alert("Subscription received!");
                document.getElementById('sub-email').value = ''; 
            }
        });

        document.getElementById('login-btn').addEventListener('click', async () => {
            const inputPass = document.getElementById('admin-pass').value;
            const { data, error } = await db.from('admin_config').select('value').eq('key_name', 'admin_password').single();
            
            if (data && inputPass === data.value) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('editor-controls').style.display = 'block';
            } else {
                alert("ACCESS DENIED");
            }
        });

        document.getElementById('update-hero').addEventListener('click', async () => {
            const title = document.getElementById('hero-title-in').value;
            const description = document.getElementById('hero-desc-in').value;
            const bg_image_url = document.getElementById('hero-img-in').value;
            await db.from('hero_content').update({ title, description, bg_image_url }).eq('id', 1);
            fetchHero();
        });

        document.getElementById('add-game').addEventListener('click', async () => {
            const title = document.getElementById('new-game-title').value;
            const desc = document.getElementById('new-game-desc').value;
            const img = document.getElementById('new-game-img').value;
            await db.from('games').insert([{ title, description: desc, image_url: img }]);
            fetchGames();
        });

        document.addEventListener('keydown', (e) => { if (e.ctrlKey && e.shiftKey && e.key === 'E') document.getElementById('secret-editor').classList.toggle('active'); });
        document.getElementById('close-editor').addEventListener('click', () => document.getElementById('secret-editor').classList.remove('active'));

        fetchHero();
        fetchGames();
    </script>
</body>
</html>
