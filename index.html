<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOUBLE TROUBLE STUDIOS // Game Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: #111; color: white; font-family: sans-serif; text-align: center; padding: 50px;">

    <h1>DOUBLE TROUBLE STUDIOS</h1>
    <h2 id="hero-title">LOADING...</h2>
    <p id="hero-desc"></p>

    <div style="margin-top: 40px;">
        <input type="email" id="sub-email" placeholder="ENTER YOUR EMAIL" style="padding: 10px;">
        <button id="sub-btn" style="padding: 10px;">SUBSCRIBE</button>
    </div>

    <script>
        const SUPA_URL = "https://elifhcqurdemwsbgrxnu.supabase.co";
        const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsaWZoY3F1cmRlbXdzYmdyeG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNTQ2NTUsImV4cCI6MjA5OTgzMDY1NX0.cKszlA20kGNJRiy8K5GNdgpsqCeYl98qwNS-AvHac_Q";
        
        const db = supabase.createClient(SUPA_URL, SUPA_KEY);

        // 1. Haetaan sisältö
        async function loadContent() {
            const { data } = await db.from('hero_content').select('*').eq('id', 1).single();
            if (data) {
                document.getElementById('hero-title').innerText = data.title;
                document.getElementById('hero-desc').innerText = data.description;
            }
        }

        // 2. Tallennetaan vain tietokantaan (Make.com hoitaa loput)
        document.getElementById('sub-btn').addEventListener('click', async () => {
            const email = document.getElementById('sub-email').value;
            if (!email) return alert("Syötä sähköposti!");

            console.log("Tallennetaan tietokantaan...");
            const { error } = await db.from('subscribers').insert([{ email: email }]);
            
            if (error) {
                console.error("Virhe:", error);
                alert("Tilaus epäonnistui: " + error.message);
            } else {
                alert("Tilaus onnistui!");
                document.getElementById('sub-email').value = ""; // Tyhjennetään kenttä
            }
        });

        loadContent();
    </script>
</body>
</html>
